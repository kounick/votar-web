<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#000000">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="VotAR">
<meta name="apple-mobile-web-app-status-bar-style" content="black">
<title>VotAR</title>
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<link rel="icon" href="icons/icon-192.png">
<link rel="stylesheet" href="style.css">
</head>
<body>
<div id="app">
  <section id="stage">
    <canvas id="photo" aria-label="Photo du public avec les votes détectés"></canvas>
    <p id="intro">Bienvenue sur VotAR. Appuyez sur « Appareil photo » pour commencer, ou sur ce texte pour ouvrir l'aide dans votre navigateur.</p>
  </section>

  <section id="controls">
    <div id="bars">
      <div class="row"><span class="label" id="label0">a</span><div class="bar"><div class="fill" id="fill0" style="background:#00ff00"></div></div></div>
      <div class="row"><span class="label" id="label1">b</span><div class="bar"><div class="fill" id="fill1" style="background:#ff00ff"></div></div></div>
      <div class="row"><span class="label" id="label2">c</span><div class="bar"><div class="fill" id="fill2" style="background:#ffff00"></div></div></div>
      <div class="row"><span class="label" id="label3">d</span><div class="bar"><div class="fill" id="fill3" style="background:#00ffff"></div></div></div>
    </div>

    <p id="status" role="status" aria-live="polite"></p>

    <div id="buttons">
      <label class="button" id="buttonCamera">Appareil photo
        <input type="file" id="inputCamera" accept="image/*" capture="environment">
      </label>
      <label class="button" id="buttonGallery">Galerie
        <input type="file" id="inputGallery" accept="image/*">
      </label>
    </div>

    <p id="credits">
      VotAR de <a href="https://votar.libre-innovation.org/">Stéphane Poinsart</a>, licence AGPL v3.
      <a href="https://github.com/kounick/votar-web">Sources de cette version</a>.
      L'analyse se fait sur votre appareil : les photos ne sont envoyées nulle part.
    </p>
  </section>
</div>
<script type="module" src="app.js"></script>
</body>
</html>
